cargo-features = ["profile-rustflags"]
[package]
name = "puzzle"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1.25.2"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
ndarray = { version = "0.17.2", features = [ "serde" ] }
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_json = "1.0.151"
smallvec = "1.16.3"

[profile.release]
debug = 2
opt-level = 3
lto = "fat"
codegen-units = 1
